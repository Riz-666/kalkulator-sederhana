<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalkulator Sederhana</title>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <main class="wrapper">
    <section class="panel">
      <h1 class="judul">Kalkulator</h1>
      <p class="sub">Pilih operasi yang mau` digunakan.</p>

      <div class="row g-3">
        <div class="col-6">
          <a href="tambah.html" class="tile op-tambah">
            <i class="fa-solid fa-plus"></i>
            <span>
              <span class="nama d-block">Penjumlahan</span>
              <span class="contoh">Contoh : 4 + 6 = 10</span>
            </span>
          </a>
        </div>
        <div class="col-6">
          <a href="kurang.html" class="tile op-kurang">
            <i class="fa-solid fa-minus"></i>
            <span>
              <span class="nama d-block">Pengurangan</span>
              <span class="contoh">Contoh : 9 &minus; 3 = 6</span>
            </span>
          </a>
        </div>
        <div class="col-6">
          <a href="kali.html" class="tile op-kali">
            <i class="fa-solid fa-xmark"></i>
            <span>
              <span class="nama d-block">Perkalian</span>
              <span class="contoh">Contoh : 5 &times; 4 = 20</span>
            </span>
          </a>
        </div>
        <div class="col-6">
          <a href="bagi.html" class="tile op-bagi">
            <i class="fa-solid fa-divide"></i>
            <span>
              <span class="nama d-block">Pembagian</span>
              <span class="contoh">Contoh : 8 &divide; 2 = 4</span>
            </span>
          </a>
        </div>
      </div>
    </section>
    <p class="foot">Kelompok 4 - 19.7AL.07, Operasi Matematika Sederhana</p>
  </main>
</body>
</html>
