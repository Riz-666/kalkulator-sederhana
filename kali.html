<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perkalian | Kalkulator Sederhana</title>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="op-kali" data-operasi="kali">
  <main class="wrapper">
    <a href="index.html" class="kembali"><i class="fa-solid fa-arrow-left me-1"></i>Kembali ke menu utama</a>

    <section class="panel">
      <div class="judul-op">
        <span class="ikon"><i class="fa-solid fa-xmark"></i></span>
        <h1>Perkalian</h1>
      </div>

      <form id="formHitung" novalidate>
        <div class="mb-3">
          <label for="angkaPertama" class="form-label">Angka pertama</label>
          <input type="number" step="any" class="form-control" id="angkaPertama" placeholder="Contoh: 4" autofocus>
        </div>
        <div class="mb-4">
          <label for="angkaKedua" class="form-label">Angka kedua</label>
          <input type="number" step="any" class="form-control" id="angkaKedua" placeholder="Contoh: 6">
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-hitung flex-grow-1">
            <i class="fa-solid fa-calculator me-2"></i>Hitung
          </button>
          <button type="button" class="btn btn-reset" id="btnReset" aria-label="Kosongkan isian">
            <i class="fa-solid fa-rotate-left"></i>
          </button>
        </div>
      </form>

      <div id="hasil" class="hasil d-none" aria-live="polite"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.all.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
